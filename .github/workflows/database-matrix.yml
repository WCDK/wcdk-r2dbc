name: Database matrix
on:
  push:
  pull_request:
jobs:
  oracle-xe:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-xe:21-slim-faststart
        env:
          ORACLE_PASSWORD: MatrixTestOnly42
          APP_USER: wcdk_matrix
          APP_USER_PASSWORD: MatrixTestOnly42
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh --health-interval 10s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode -Poracle verify
        env:
          WCDK_R2DBC_ORACLE_URL: r2dbc:oracle://localhost:1521/XEPDB1
          WCDK_R2DBC_ORACLE_USERNAME: wcdk_matrix
          WCDK_R2DBC_ORACLE_PASSWORD: MatrixTestOnly42
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-xe-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
  postgres-mysql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
