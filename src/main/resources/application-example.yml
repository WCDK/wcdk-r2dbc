# WCDK R2DBC 多数据库配置示例
# 支持达梦、PostgreSQL、MySQL、Oracle数据库

spring:
  r2dbc:
    # 主数据源名称
    primary: master
    # 多数据源配置
    data-sources:
      # 达梦数据库
      master:
        url: r2dbc:dm://localhost:5236
        username: SYSDBA
        password: SYSDBA
        pool:
          enabled: true
          max-size: 20
          max-idle-time: 30m
          max-life-time: 30m
          max-acquire-time: 10s
          acquire-retry: 3
          initial-size: 5
      # PostgreSQL数据库
      postgres:
        url: r2dbc:postgresql://localhost:5432/testdb
        username: postgres
        password: postgres
        pool:
          enabled: true
          max-size: 20
          max-idle-time: 30m
          max-life-time: 30m
      
      # MySQL数据库
      mysql:
        url: r2dbc:mysql://localhost:3306/testdb
        username: root
        password: root
        pool:
          enabled: true
          max-size: 20
          max-idle-time: 30m
          max-life-time: 30m
      
      # Oracle数据库
      oracle:
        url: r2dbc:oracle://localhost:1521/testdb
        username: system
        password: oracle
        pool:
          enabled: true
          max-size: 20
          max-idle-time: 30m
          max-life-time: 30m
    
    # 全局连接池配置（数据源声明 pool 时整体替换，不逐字段合并）
    pool:
      enabled: true
      max-size: 20
      max-idle-time: 30m
      max-life-time: 30m
      max-acquire-time: 10s
      acquire-retry: 3
      initial-size: 5

# WCDK R2DBC 配置
wcdk:
  r2dbc:
    # 可选：WCDK 单库回退/Schema 初始化类型提示，空值自动检测；替代旧 database.type
    # database-type: dm
    enabled: true
    # SQL日志默认关闭，排查时显式开启
    sql-log-enabled: false
    # 雪花ID生成
    snowflake-id: true

    # 生产多实例必须分配不同节点编号，范围 0 到 1023
    snowflake-worker-id: ${WCDK_R2DBC_WORKER_ID:0}
